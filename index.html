<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>pbdq</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--p:#3D1E6D;--c:#22D3EE}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#17151b;font-family:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
header{height:64px;display:flex;align-items:center;justify-content:center}
.logo{display:flex;gap:1px;font-size:30px;font-weight:950;letter-spacing:-2px;color:var(--p);line-height:1}
.logo span{animation:orbit 5s ease-in-out infinite}
.logo span:nth-child(2){animation-delay:.12s}.logo span:nth-child(3){animation-delay:.24s}.logo span:nth-child(4){animation-delay:.36s}
@keyframes orbit{0%,75%,100%{transform:rotate(0)}85%{transform:rotate(14deg)}92%{transform:rotate(-9deg)}}
main{width:min(100%,660px);margin:auto;padding:5px 14px 18px}
.workspace{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:stretch}
.tools{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:4px}
.tool{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid #eeeaf2;background:#fff;border-radius:15px;color:var(--p);box-shadow:0 2px 8px #28104708;flex-shrink:0}
.tool:active,.action:active{transform:scale(.96)}
.tool svg,.action svg{width:18px;height:18px}
.brush{flex:1;min-height:130px;width:44px;position:relative;border:1px solid #e8e4ee;border-radius:22px;background:#f4f2f7;touch-action:none;overflow:hidden;cursor:ns-resize}
.brush-track{position:absolute;left:50%;top:13px;bottom:13px;width:5px;transform:translateX(-50%);border-radius:10px;background:#ded8e8}
.brush-fill{position:absolute;left:50%;bottom:13px;width:5px;height:25%;transform:translateX(-50%);border-radius:10px;background:var(--p)}
.brush-knob{position:absolute;left:50%;top:75%;width:31px;height:31px;transform:translate(-50%,-50%);border-radius:50%;background:white;border:1px solid #e5e0eb;box-shadow:0 2px 7px #24113a1b;display:flex;align-items:center;justify-content:center;pointer-events:none}
.brush-knob:before{content:"";width:10px;height:2px;background:#b8b0c5;border-radius:4px;box-shadow:0 4px #b8b0c5,0 -4px #b8b0c5}
.brush-value{font-size:10px;font-weight:800;color:var(--p);text-align:center;white-space:nowrap}
.stage{position:relative;width:100%;aspect-ratio:4/5;max-height:calc(100dvh - 145px);min-height:320px;overflow:hidden;background:#f5f2f8;isolation:isolate;touch-action:none;user-select:none}
#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:1;pointer-events:none;transform:scaleX(-1)}
#artCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;display:block;touch-action:none}
.watermark{position:absolute;z-index:5;top:12px;right:12px;pointer-events:none;background:var(--p);color:#fff;padding:7px 11px 9px;transform:rotate(2deg);box-shadow:0 2px 8px #0001}
.watermark .logo{font-size:22px;letter-spacing:-1.5px;color:white}
.watermark .logo span{animation:none}
.led{display:none;position:absolute;z-index:6;left:12px;top:16px;width:11px;height:11px;background:#ff243c;border-radius:50%;box-shadow:0 0 0 4px #ff243c22;animation:blink 1.1s infinite}
.led.active{display:block}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.bottom-controls{display:flex;justify-content:center;gap:9px;margin-top:12px}
.action{height:44px;padding:0 18px;border-radius:999px;border:1px solid #eae6ef;background:#fff;color:var(--p);font-size:12px;font-weight:750;display:flex;align-items:center;justify-content:center;gap:8px}
.primary{background:var(--p);border-color:var(--p);color:white}
.camera-row{display:flex;justify-content:center;margin-top:9px}
.camera-row .action{min-width:165px}
.claim{text-align:center;font-size:10px;letter-spacing:.025em;color:#77717e;margin:24px 0 20px}
footer{text-align:center;padding:14px 12px 22px;border-top:1px solid #f0edf2;font-size:10px;color:#aaa}
.toast{position:fixed;z-index:30;bottom:25px;left:50%;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:#21152e;color:white;border-radius:99px;padding:11px 16px;font-size:12px;transition:.2s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.clean header,body.clean .tools,body.clean .bottom-controls,body.clean .camera-row,body.clean .claim,body.clean footer{display:none!important}
body.clean main{padding:0;width:100%;height:100dvh}
body.clean .workspace{display:block;height:100%}
body.clean .stage{position:fixed;inset:0;width:100vw;height:100dvh;max-height:none;min-height:0;aspect-ratio:auto;background:#000}
@media(min-width:600px){main{padding-top:10px}.stage{max-height:740px}.claim{margin-top:28px}}
@media(max-height:650px){.stage{min-height:0;max-height:calc(100dvh - 140px)}header{height:52px}.tool{height:39px;width:40px}.brush{width:40px}}
</style>
</head>
<body>
<header><a href="#" class="logo" aria-label="pbdq"><span>p</span><span>b</span><span>d</span><span>q</span></a></header>
<main>
<div class="workspace">
<aside class="tools" aria-label="Strumenti">
<label class="tool" title="Upload" aria-label="Upload immagine">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4m-5 5 5-5 5 5"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>
<input id="upload" type="file" accept="image/*" hidden>
</label>
<button id="undo" class="tool" title="Undo" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a7 7 0 1 1 0 14h-1"/></svg></button>
<button id="reset" class="tool" title="Reset" aria-label="Reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
<div id="brush" class="brush" role="slider" aria-label="Dimensione gomma: trascina verticalmente" aria-valuemin="4" aria-valuemax="100" aria-valuenow="28" tabindex="0">
<div class="brush-track"></div><div id="brushFill" class="brush-fill"></div><div id="knob" class="brush-knob"></div>
</div>
<div id="brushValue" class="brush-value">28 px</div>
</aside>
<section id="stage" class="stage" aria-label="Ritratto interattivo">
<video id="camera" autoplay muted playsinline></video>
<canvas id="artCanvas"></canvas>
<div id="led" class="led" aria-label="Fotocamera attiva"></div>
<div class="watermark"><div class="logo"><span>p</span><span>b</span><span>d</span><span>q</span></div></div>
</section>
</div>
<div class="camera-row"><button id="cameraBtn" class="action primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3"/><path d="m8 6 1-2h6l1 2"/></svg>Start camera</button></div>
<p class="claim">nothing is saved on this website, record screen to save contents</p>
</main>
<footer>100% Client-side. No images or videos leave your device.</footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('artCanvas'),ctx=canvas.getContext('2d'),stage=$('stage'),video=$('camera');
let img=null,iw=0,ih=0,art=null,actx=null,artScale=1;
let brushSize=28,zoom=1,panX=0,panY=0,undoStack=[],stream=null,clean=false;
let pointers=new Map(),gesture=null,drawing=false,strokePointer=null,last=null;
let raf=0,renderPending=false,gestureBlocked=false;
const MAX_UNDO=8,MAX_ART=1800;

function toast(s){const el=$('toast');el.textContent=s;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2300)}
function makeArt(){
 artScale=Math.min(1,MAX_ART/Math.max(iw,ih));
 art=document.createElement('canvas');
 art.width=Math.max(1,Math.round(iw*artScale));
 art.height=Math.max(1,Math.round(ih*artScale));
 actx=art.getContext('2d',{willReadFrequently:true});
 actx.clearRect(0,0,art.width,art.height);
 actx.drawImage(img,0,0,art.width,art.height);
}
function resize(){
 const r=stage.getBoundingClientRect();if(!r.width||!r.height)return;
 const d=Math.min(devicePixelRatio||1,1.5),w=Math.round(r.width*d),h=Math.round(r.height*d);
 if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;render()}
}
function transform(){
 const scale=Math.min(canvas.width/iw,canvas.height/ih)*zoom;
 return{scale,x:(canvas.width-iw*scale)/2+panX*canvas.width/stage.clientWidth,y:(canvas.height-ih*scale)/2+panY*canvas.height/stage.clientHeight};
}
function render(){
 if(!img||!canvas.width||!art)return;
 ctx.clearRect(0,0,canvas.width,canvas.height);
 const t=transform(),dw=iw*t.scale,dh=ih*t.scale;
 ctx.drawImage(art,0,0,art.width,art.height,t.x,t.y,dw,dh);
}
function requestRender(){if(renderPending)return;renderPending=true;raf=requestAnimationFrame(()=>{renderPending=false;render()})}
function loadImage(image){
 img=image;iw=image.naturalWidth||image.width;ih=image.naturalHeight||image.height;
 makeArt();undoStack=[];zoom=1;panX=panY=0;render();
}
function loadDefault(){
 const urls=['https://upload.wikimedia.org/wikipedia/commons/6/6a/Mona_Lisa.jpg','https://commons.wikimedia.org/wiki/Special:FilePath/Mona_Lisa%2C_by_Leonardo_da_Vinci%2C_from_C2RMF_retouched.jpg'];let i=0;
 function attempt(){if(i>=urls.length){toast('Carica un’immagine per iniziare.');return}
 const im=new Image();im.crossOrigin='anonymous';im.onload=()=>loadImage(im);im.onerror=()=>{i++;attempt()};im.src=urls[i]}
 attempt();
}
$('upload').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;
 if(!f.type.startsWith('image/')){toast('Seleziona un’immagine valida.');return}
 const url=URL.createObjectURL(f),im=new Image();
 im.onload=()=>{loadImage(im);URL.revokeObjectURL(url)};
 im.onerror=()=>{URL.revokeObjectURL(url);toast('Impossibile aprire l’immagine.')};
 im.src=url;e.target.value='';
});
function snapshot(){
 try{undoStack.push(actx.getImageData(0,0,art.width,art.height));if(undoStack.length>MAX_UNDO)undoStack.shift()}
 catch(e){toast('Immagine troppo grande per Undo.')}
}
function undo(){if(!undoStack.length){toast('Niente da annullare.');return}actx.putImageData(undoStack.pop(),0,0);requestRender()}
function reset(){if(!art||!img)return;makeArt();undoStack=[];zoom=1;panX=panY=0;render()}
$('undo').onclick=undo;$('reset').onclick=reset;

function setBrush(v){
 brushSize=Math.max(4,Math.min(100,Math.round(v)));
 $('brushValue').textContent=brushSize+' px';$('brush').setAttribute('aria-valuenow',brushSize);
 const r=$('brush').clientHeight-26,ratio=(brushSize-4)/96;
 $('knob').style.top=(13+(1-ratio)*r)+'px';
 $('brushFill').style.height=(ratio*100)+'%';
}
let brushDrag=null;
function updateBrush(e){
 const r=$('brush').getBoundingClientRect();
 setBrush(4+(1-Math.max(0,Math.min(1,(e.clientY-r.top)/r.height)))*96);
}
$('brush').addEventListener('pointerdown',e=>{e.preventDefault();brushDrag=e.pointerId;$('brush').setPointerCapture(e.pointerId);updateBrush(e)});
$('brush').addEventListener('pointermove',e=>{if(brushDrag===e.pointerId)updateBrush(e)});
function endBrush(e){if(brushDrag===e.pointerId)brushDrag=null}
$('brush').addEventListener('pointerup',endBrush);$('brush').addEventListener('pointercancel',endBrush);
$('brush').addEventListener('keydown',e=>{if(e.key==='ArrowUp'){setBrush(brushSize+4);e.preventDefault()}if(e.key==='ArrowDown'){setBrush(brushSize-4);e.preventDefault()}});
setBrush(28);

function point(e){
 const r=canvas.getBoundingClientRect();
 return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height};
}
function imagePoint(e){
 const p=point(e),t=transform();
 return{x:Math.max(0,Math.min(iw,(p.x-t.x)/t.scale)),y:Math.max(0,Math.min(ih,(p.y-t.y)/t.scale))};
}
function erase(a,b){
 if(!drawing||!actx||!a||!b)return;
 const sx=art.width/iw,sy=art.height/ih;
 const ax=a.x*sx,ay=a.y*sy,bx=b.x*sx,by=b.y*sy;
 // Keep the brush visually consistent at every zoom level.
 const screenRadius=brushSize*canvas.width/stage.clientWidth/2;
 const t=transform(),radius=Math.max(1,screenRadius/t.scale*(sx+sy)/2);
 actx.save();actx.globalCompositeOperation='destination-out';
 actx.lineCap='round';actx.lineJoin='round';actx.lineWidth=radius*2;
 actx.beginPath();actx.moveTo(ax,ay);actx.lineTo(bx,by);actx.stroke();
 actx.beginPath();actx.arc(bx,by,radius,0,Math.PI*2);actx.fill();actx.restore();
 requestRender();
}
function mid(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function stopStroke(){drawing=false;strokePointer=null;last=null}
function startPinch(){
 const p=[...pointers.values()];if(p.length<2)return;
 stopStroke();gestureBlocked=true;
 gesture={type:'pinch',dist:Math.max(1,dist(p[0],p[1])),zoom,mid:mid(p[0],p[1]),panX,panY};
}
stage.addEventListener('pointerdown',e=>{
 if(clean){exitClean();return}
 if(e.pointerType==='mouse'&&e.button!==0)return;
 e.preventDefault();
 try{stage.setPointerCapture(e.pointerId)}catch(_){}
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size>=2){startPinch();return}
 if(pointers.size!==1||gestureBlocked)return;
 gesture=null;drawing=true;strokePointer=e.pointerId;last=imagePoint(e);snapshot();erase(last,last);
});
stage.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;
 e.preventDefault();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size>=2){
  if(!gesture||gesture.type!=='pinch')startPinch();
  const p=[...pointers.values()],m=mid(p[0],p[1]),d=dist(p[0],p[1]);
  if(gesture&&gesture.type==='pinch'){
   zoom=Math.max(.5,Math.min(5,gesture.zoom*d/gesture.dist));
   panX=gesture.panX+(m.x-gesture.mid.x)*stage.clientWidth/canvas.width;
   panY=gesture.panY+(m.y-gesture.mid.y)*stage.clientHeight/canvas.height;
   requestRender();
  }
  return;
 }
 if(drawing&&e.pointerId===strokePointer&&!gestureBlocked){
  const n=imagePoint(e);erase(last,n);last=n;
 }
});
function endPointer(e){
 if(!pointers.has(e.pointerId))return;
 pointers.delete(e.pointerId);
 if(e.pointerId===strokePointer)stopStroke();
 if(pointers.size>=2)startPinch();
 else if(pointers.size===1){stopStroke();gestureBlocked=true;gesture={type:'wait'}}
 else{gesture=null;gestureBlocked=false}
}
['pointerup','pointercancel','lostpointercapture'].forEach(type=>stage.addEventListener(type,endPointer));
// Fallback per Safari/iOS meno recenti che non espongono Pointer Events.
if(!('PointerEvent' in window)){
 let touchDrawing=false,touchLast=null,touchPinch=null;
 const touchPoint=t=>({clientX:t.clientX,clientY:t.clientY});
 stage.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(clean){exitClean();return}
  if(e.touches.length>=2){
   touchDrawing=false;touchLast=null;drawing=false;
   const a=e.touches[0],b=e.touches[1];
   touchPinch={dist:Math.max(1,Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)),zoom,mid:{x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2},panX,panY};
   return;
  }
  if(e.touches.length===1){touchPinch=null;touchDrawing=true;drawing=true;touchLast=imagePoint(touchPoint(e.touches[0]));last=touchLast;snapshot();erase(touchLast,touchLast)}
 },{passive:false});
 stage.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length>=2){
   touchDrawing=false;drawing=false;last=null;
   if(!touchPinch){const a=e.touches[0],b=e.touches[1];touchPinch={dist:Math.max(1,Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)),zoom,mid:{x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2},panX,panY};}
   const a=e.touches[0],b=e.touches[1],m={x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2},d=Math.max(1,Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY));
   zoom=Math.max(.5,Math.min(5,touchPinch.zoom*d/touchPinch.dist));
   panX=touchPinch.panX+(m.x-touchPinch.mid.x)*stage.clientWidth/canvas.width;
   panY=touchPinch.panY+(m.y-touchPinch.mid.y)*stage.clientHeight/canvas.height;requestRender();return;
  }
  if(touchDrawing&&e.touches.length===1){const n=imagePoint(touchPoint(e.touches[0]));erase(touchLast,n);touchLast=n;last=n;}
 },{passive:false});
 const endTouch=e=>{e.preventDefault();if(e.touches.length===0){touchDrawing=false;touchLast=null;touchPinch=null;stopStroke()}else if(e.touches.length===1){touchDrawing=false;touchLast=null;touchPinch=null;stopStroke()}};
 stage.addEventListener('touchend',endTouch,{passive:false});stage.addEventListener('touchcancel',endTouch,{passive:false});
}
stage.addEventListener('contextmenu',e=>e.preventDefault());

async function startCamera(){
 if(!navigator.mediaDevices?.getUserMedia){toast('La fotocamera richiede HTTPS.');return}
 try{
  stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user'}});
  video.srcObject=stream;video.style.display='block';await video.play();
  $('led').classList.add('active');$('cameraBtn').textContent='Stop camera';$('cameraBtn').onclick=stopCamera;
 }catch(e){toast('Consenti l’accesso alla fotocamera nel browser.')}
}
function stopCamera(){
 if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=null;video.pause();video.srcObject=null;video.style.display='none';
 $('led').classList.remove('active');$('cameraBtn').textContent='Start camera';$('cameraBtn').onclick=startCamera;
}
$('cameraBtn').onclick=startCamera;
function exitClean(){clean=false;document.body.classList.remove('clean')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&clean)exitClean()});
window.addEventListener('resize',resize);
if('ResizeObserver'in window)new ResizeObserver(resize).observe(stage);
resize();loadDefault();
})();
</script>
</body>
</html>
