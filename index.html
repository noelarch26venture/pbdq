<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff">
<title>pbdq</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--p:#3D1E6D;--c:#22D3EE}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#17151b;font-family:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
header{height:68px;display:flex;align-items:center;justify-content:center}
.logo{display:flex;gap:1px;font-size:30px;font-weight:950;letter-spacing:-2px;color:var(--p);line-height:1}
.logo span{animation:orbit 5s ease-in-out infinite}
.logo span:nth-child(2){animation-delay:.12s}.logo span:nth-child(3){animation-delay:.24s}.logo span:nth-child(4){animation-delay:.36s}
@keyframes orbit{0%,75%,100%{transform:rotate(0)}85%{transform:rotate(14deg)}92%{transform:rotate(-9deg)}}
main{width:min(100%,660px);margin:auto;padding:6px 14px 18px}
.workspace{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:stretch}
.tools{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:4px}
.tool{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid #eeeaf2;background:white;border-radius:15px;color:var(--p);box-shadow:0 2px 8px #28104708}
.tool:active{transform:scale(.94)}
.tool svg{width:19px;height:19px}
.brush{flex:1;min-height:120px;width:44px;position:relative;border:1px solid #eeeaf2;border-radius:16px;background:#faf9fc;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden}
.brush-line{position:absolute;width:3px;height:65%;background:linear-gradient(var(--c),var(--p));border-radius:5px}
.brush-knob{position:absolute;width:30px;height:30px;background:#fff;border:2px solid var(--c);border-radius:50%;box-shadow:0 2px 8px #0001;display:flex;align-items:center;justify-content:center}
.brush-knob:after{content:"";width:5px;height:5px;background:var(--p);border-radius:50%}
.brush-hint{position:absolute;bottom:7px;font-size:9px;color:#888;writing-mode:vertical-rl;letter-spacing:.08em}
.brush-value{font-size:10px;font-weight:800;color:var(--p);text-align:center}
.stage{position:relative;width:100%;aspect-ratio:4/5;max-height:calc(100dvh - 160px);min-height:330px;overflow:hidden;background:#f5f2f8;border-radius:4px;isolation:isolate;touch-action:none;user-select:none}
#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:1;pointer-events:none;transform:scaleX(-1)}
#artCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;display:block;touch-action:none}
.led{display:none;position:absolute;z-index:5;right:13px;top:13px;width:12px;height:12px;background:#ff243c;border-radius:50%;box-shadow:0 0 0 4px #ff243c25;animation:blink 1.1s infinite}
.led.active{display:block}
@keyframes blink{0%,100%{opacity:1;box-shadow:0 0 0 4px #ff243c22}50%{opacity:.35;box-shadow:0 0 0 7px #ff243c12}}
.watermark{position:absolute;z-index:4;right:13px;bottom:12px;pointer-events:none;opacity:.7}
.watermark .logo{font-size:25px;color:var(--p);text-shadow:0 1px 6px #fff8}
.bottom-controls{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
.action{height:44px;padding:0 16px;border-radius:999px;border:1px solid #eae6ef;background:white;color:var(--p);font-size:12px;font-weight:750;display:flex;align-items:center;justify-content:center;gap:8px}
.action svg{width:16px;height:16px}
.primary{background:var(--p);border-color:var(--p);color:white}
.action:active{transform:scale(.97)}
.camera-row{display:flex;justify-content:center;margin-top:9px}
.camera-row .action{min-width:165px}
.claim{text-align:center;font-size:10px;letter-spacing:.035em;color:#77717e;margin:24px 0 20px}
footer{text-align:center;padding:14px 12px 22px;border-top:1px solid #f0edf2;font-size:10px;color:#aaa}
.toast{position:fixed;z-index:30;bottom:25px;left:50%;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:#21152e;color:#fff;border-radius:99px;padding:11px 16px;font-size:12px;transition:.2s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.clean header,body.clean .tools,body.clean .bottom-controls,body.clean .camera-row,body.clean .claim,body.clean footer{display:none!important}
body.clean main{padding:0;width:100%;height:100dvh}
body.clean .workspace{display:block;height:100%}
body.clean .stage{position:fixed;inset:0;width:100vw;height:100dvh;max-height:none;min-height:0;aspect-ratio:auto;border-radius:0;background:#000}
body.clean .watermark{display:block}
@media(min-width:600px){main{padding-top:10px}.stage{max-height:740px}.claim{margin-top:28px}}
@media(max-height:650px){.stage{min-height:0;max-height:calc(100dvh - 145px)}header{height:54px}.tool{height:39px;width:40px}.brush{width:40px}}
</style>
</head>
<body>
<header><a href="#" class="logo" aria-label="pbdq"><span>p</span><span>b</span><span>d</span><span>q</span></a></header>

<main>
<div class="workspace">
<aside class="tools" aria-label="Canvas tools">
<label class="tool" title="Upload portrait" aria-label="Upload portrait">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4m-5 5 5-5 5 5"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>
<input id="upload" type="file" accept="image/*" hidden>
</label>
<button id="undo" class="tool" title="Undo" aria-label="Undo">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a7 7 0 1 1 0 14h-1"/></svg>
</button>
<button id="reset" class="tool" title="Reset portrait" aria-label="Reset portrait">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
</button>
<div id="brush" class="brush" role="slider" aria-label="Eraser size: drag up or down" aria-valuemin="4" aria-valuemax="100" aria-valuenow="28" tabindex="0">
<div class="brush-line"></div>
<div id="knob" class="brush-knob"></div>
<span class="brush-hint">DRAG TO SIZE</span>
</div>
<div id="brushValue" class="brush-value">28 px</div>
</aside>

<section id="stage" class="stage" aria-label="Portrait canvas">
<video id="camera" autoplay muted playsinline></video>
<canvas id="artCanvas"></canvas>
<div id="led" class="led" aria-label="Camera active"></div>
<div class="watermark"><div class="logo"><span>p</span><span>b</span><span>d</span><span>q</span></div></div>
</section>
</div>

<div class="bottom-controls">
<button id="uploadBtn" class="action">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
Upload
</button>
<button id="undoBtn" class="action">Undo</button>
<button id="resetBtn" class="action">Reset</button>
</div>
<div class="camera-row">
<button id="cameraBtn" class="action primary">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3"/><path d="m8 6 1-2h6l1 2"/></svg>
Start camera
</button>
</div>

<p class="claim">nothing is saved on this website, record screen to save contents</p>
</main>

<footer>100% Client-side. No images or videos leave your device.</footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('artCanvas'),ctx=canvas.getContext('2d');
const stage=$('stage'),video=$('camera');
let img=null,iw=0,ih=0,name='Mona Lisa';
let brushSize=28,zoom=1,panX=0,panY=0;
let undoStack=[],stream=null,clean=false;
let pointers=new Map(),gesture=null,drawing=false,strokePointer=null,last=null;
let strokeToken=0,strokeSnapshot=false;
const MAX_UNDO=12;

function toast(s){
 const el=$('toast');el.textContent=s;el.classList.add('show');
 clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2300);
}
function resize(){
 const r=stage.getBoundingClientRect();if(!r.width||!r.height)return;
 const d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);
 if(canvas.width===w&&canvas.height===h)return;
 canvas.width=w;canvas.height=h;canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';
 render();
}
function transform(){
 const scale=Math.min(canvas.width/iw,canvas.height/ih)*zoom;
 return {scale,x:(canvas.width-iw*scale)/2+panX*canvas.width/stage.clientWidth,
 y:(canvas.height-ih*scale)/2+panY*canvas.height/stage.clientHeight};
}
function render(){
 if(!img||!canvas.width)return;
 ctx.clearRect(0,0,canvas.width,canvas.height);
 const t=transform();
 ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
 ctx.drawImage(img,t.x,t.y,iw*t.scale,ih*t.scale);
}
function loadImage(image,label){
 img=image;iw=image.naturalWidth||image.width;ih=image.naturalHeight||image.height;
 name=label;undoStack=[];zoom=1;panX=panY=0;render();
}
function loadDefault(){
 let i=0;
 const urls=[
 'https://upload.wikimedia.org/wikipedia/commons/6/6a/Mona_Lisa.jpg',
 'https://commons.wikimedia.org/wiki/Special:FilePath/Mona_Lisa%2C_by_Leonardo_da_Vinci%2C_from_C2RMF_retouched.jpg'
 ];
 function attempt(){
  if(i>=urls.length){toast('Upload a portrait to get started.');return}
  const im=new Image();im.crossOrigin='anonymous';
  im.onload=()=>loadImage(im,'Mona Lisa');
  im.onerror=()=>{i++;attempt()};im.src=urls[i];
 }
 attempt();
}
function upload(file){
 if(!file||!file.type.startsWith('image/'))return;
 const url=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{loadImage(im,file.name);URL.revokeObjectURL(url)};
 im.onerror=()=>{URL.revokeObjectURL(url);toast('Could not load image.')};
 im.src=url;
}
$('upload').addEventListener('change',e=>upload(e.target.files[0]));
$('uploadBtn').onclick=()=>$('upload').click();

function saveUndo(){
 try{
  undoStack.push(ctx.getImageData(0,0,canvas.width,canvas.height));
  if(undoStack.length>MAX_UNDO)undoStack.shift();
 }catch(e){toast('Image too large for undo.')}
}
function undo(){
 if(!undoStack.length){toast('Nothing to undo.');return}
 ctx.putImageData(undoStack.pop(),0,0);
}
function reset(){
 undoStack=[];zoom=1;panX=panY=0;render();
}
$('undo').onclick=$('undoBtn').onclick=undo;
$('reset').onclick=$('resetBtn').onclick=reset;

function setBrush(v){
 brushSize=Math.max(4,Math.min(100,Math.round(v)));
 $('brushValue').textContent=brushSize+' px';
 $('brush').setAttribute('aria-valuenow',brushSize);
 const range=$('brush').clientHeight-44;
 $('knob').style.top=(22+(100-brushSize)/96*range)+'px';
 $('knob').style.transform='translateY(-50%)';
}
let brushDrag=null;
$('brush').addEventListener('pointerdown',e=>{
 e.preventDefault();brushDrag={id:e.pointerId};
 $('brush').setPointerCapture(e.pointerId);updateBrush(e);
});
function updateBrush(e){
 const r=$('brush').getBoundingClientRect();
 setBrush(100-Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))*96);
}
$('brush').addEventListener('pointermove',e=>{if(brushDrag&&brushDrag.id===e.pointerId)updateBrush(e)});
function endBrush(e){if(brushDrag&&brushDrag.id===e.pointerId)brushDrag=null}
$('brush').addEventListener('pointerup',endBrush);
$('brush').addEventListener('pointercancel',endBrush);
$('brush').addEventListener('keydown',e=>{
 if(e.key==='ArrowUp'){setBrush(brushSize+4);e.preventDefault()}
 if(e.key==='ArrowDown'){setBrush(brushSize-4);e.preventDefault()}
});
setBrush(28);

function point(e){
 const r=canvas.getBoundingClientRect();
 return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height};
}
function erase(a,b){
 if(!drawing||!a||!b)return;
 const radius=brushSize*canvas.width/stage.clientWidth/2;
 ctx.save();ctx.globalCompositeOperation='destination-out';
 ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=radius*2;
 ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
 ctx.beginPath();ctx.arc(b.x,b.y,radius,0,Math.PI*2);ctx.fill();
 ctx.restore();
}
function mid(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function startTransform(){
 const p=[...pointers.values()];
 if(p.length<2)return;
 drawing=false;strokePointer=null;last=null;
 gesture={type:'pinch',dist:Math.max(1,dist(p[0],p[1])),zoom,mid:mid(p[0],p[1]),panX,panY};
}
function finishStroke(){
 if(!drawing)return;
 drawing=false;strokePointer=null;last=null;strokeToken++;
}
stage.addEventListener('pointerdown',e=>{
 if(clean){exitClean();return}
 if(e.pointerType==='mouse'&&e.button!==0)return;
 e.preventDefault();
 try{stage.setPointerCapture(e.pointerId)}catch(_){}
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size>=2){finishStroke();startTransform();return}
 // Do not start a stroke unless this pointer owns the gesture.
 if(pointers.size!==1)return;
 drawing=true;strokePointer=e.pointerId;strokeToken++;
 const token=strokeToken;
 last=point(e);saveUndo();strokeSnapshot=true;
 erase(last,last);
});
stage.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;
 e.preventDefault();
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size>=2){
  if(!gesture||gesture.type!=='pinch')startTransform();
  const p=[...pointers.values()],m=mid(p[0],p[1]),d=dist(p[0],p[1]);
  if(gesture&&gesture.type==='pinch'){
   zoom=Math.max(.5,Math.min(5,gesture.zoom*d/gesture.dist));
   panX=gesture.panX+(m.x-gesture.mid.x)*stage.clientWidth/canvas.width;
   panY=gesture.panY+(m.y-gesture.mid.y)*stage.clientHeight/canvas.height;
   render();
  }
  return;
 }
 if(drawing&&e.pointerId===strokePointer&&!gesture){
  const next=point(e);
  if(last)erase(last,next);
  last=next;
 }
});
function endPointer(e){
 if(!pointers.has(e.pointerId))return;
 pointers.delete(e.pointerId);
 if(e.pointerId===strokePointer)finishStroke();
 if(pointers.size>=2){startTransform()}
 else if(pointers.size===1){
  // A remaining finger must lift and start a new gesture before it can erase.
  finishStroke();gesture={type:'wait'};
 }else gesture=null;
}
['pointerup','pointercancel','lostpointercapture'].forEach(type=>stage.addEventListener(type,endPointer));
stage.addEventListener('contextmenu',e=>e.preventDefault());
stage.addEventListener('click',()=>{if(clean)exitClean()});

async function startCamera(){
 if(!navigator.mediaDevices?.getUserMedia){toast('Camera requires HTTPS.');return}
 try{
  stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user'}});
  video.srcObject=stream;video.style.display='block';await video.play();
  $('led').classList.add('active');$('cameraBtn').textContent='Stop camera';
  $('cameraBtn').onclick=stopCamera;toast('Camera active.');
 }catch(e){toast('Allow camera access in your browser.')}
}
function stopCamera(){
 if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=null;video.pause();video.srcObject=null;video.style.display='none';
 $('led').classList.remove('active');$('cameraBtn').textContent='Start camera';
 $('cameraBtn').onclick=startCamera;
}
$('cameraBtn').onclick=startCamera;

function enterClean(){clean=true;document.body.classList.add('clean')}
function exitClean(){clean=false;document.body.classList.remove('clean')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&clean)exitClean()});
window.addEventListener('resize',resize);
if('ResizeObserver'in window)new ResizeObserver(()=>{resize()}).observe(stage);
resize();loadDefault();
})();
</script>
</body>
</html>
